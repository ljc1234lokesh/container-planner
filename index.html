<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Container Stuffing Planner</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col md:flex-row h-screen w-screen overflow-hidden">
    <aside class="w-full md:w-80 lg:w-96 bg-white shadow-xl flex flex-col z-10 h-full overflow-y-auto">
        <div class="p-6 flex-1 flex flex-col gap-6">
            <header>
                <h1 class="text-2xl font-bold text-gray-900 mb-1">Container Planner</h1>
                <p class="text-sm text-gray-500">Plan 3D box stuffing.</p>
            </header>
            <section class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h2 class="text-sm font-semibold text-gray-700 uppercase mb-3">Container Selection</h2>
                <select id="container-type" onchange="updateContainerSize()" class="w-full px-2 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="20">20' feet (28 cbm)</option>
                    <option value="40">40' feet (58 cbm)</option>
                    <option value="40hc">40' feet High Cube (68 cbm)</option>
                </select>
            </section>
            <section class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h2 class="text-sm font-semibold text-gray-700 uppercase mb-3">Upload Data</h2>
                <input type="file" id="csv-file" accept=".csv" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700">
                <div class="mt-3 flex justify-between">
                    <p class="text-xs text-gray-400">Upload CSV data</p>
                    <button onclick="downloadTemplate()" class="text-xs text-blue-600 font-semibold hover:underline">Download Template</button>
                </div>
            </section>
            <section class="flex-1 flex flex-col">
                <h2 class="text-sm font-semibold text-gray-700 uppercase mb-3">Packing Stats</h2>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <div class="text-xs text-blue-500 font-semibold">TOTAL CBM</div>
                        <div id="stat-total-cbm" class="text-lg font-bold text-blue-700">0.00</div>
                    </div>
                    <div class="bg-green-50 p-3 rounded-lg border border-green-100">
                        <div class="text-xs text-green-500 font-semibold">USED CBM</div>
                        <div id="stat-used-cbm" class="text-lg font-bold text-green-700">0.00</div>
                    </div>
                    <div class="bg-purple-50 p-3 rounded-lg border border-purple-100 col-span-2">
                        <div class="text-xs text-purple-500 font-semibold">EFFICIENCY</div>
                        <div class="flex items-center gap-2">
                            <div class="flex-1 bg-purple-200 rounded-full h-2"><div id="stat-efficiency-bar" class="bg-purple-600 h-2 rounded-full" style="width:0%"></div></div>
                            <span id="stat-efficiency-text" class="text-sm font-bold text-purple-700">0%</span>
                        </div>
                    </div>
                </div>
            </section>
                <section class="mt-4 pb-4">
                <div id="message-box" class="mb-3 text-sm text-center min-h-[1.5rem]"></div>
                <button onclick="startPlanning()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-lg">Start Planning</button>
                <button id="download-tally-btn" onclick="downloadTallySheet()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg shadow-lg mt-3 hidden">Download Tally Sheet</button>
            </section>
        </div>
    </aside>
    <main class="flex-1 relative bg-gray-900" id="canvas-container">
        <div class="absolute top-4 left-4 text-white/50 text-sm pointer-events-none z-10 bg-black/20 p-2 rounded">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>
    </main>
    <script>
    let containerSize = { w: 5.89, h: 2.39, d: 2.35, maxCbm: 28 };
    let boxes = []; let globalPackedBoxes = []; let boxIdCounter = 0;
    let scene, camera, renderer, controls, containerMesh, boxGroup;

    function init() { initThreeJS(); updateContainerSize(); animate(); }

    function initThreeJS() {
        const c = document.getElementById('canvas-container');
        scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a202c);
        camera = new THREE.PerspectiveCamera(45, c.clientWidth / c.clientHeight, 0.1, 1000); camera.position.set(30, 20, 35);
        renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(c.clientWidth, c.clientHeight);
        c.appendChild(renderer.domElement);
        controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.target.set(0,0,0);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dL = new THREE.DirectionalLight(0xffffff, 0.6); dL.position.set(10, 20, 10); scene.add(dL);
        boxGroup = new THREE.Group(); scene.add(boxGroup); window.addEventListener('resize', onWindowResize, false);
    }

    function updateContainerSize() {
        const t = document.getElementById('container-type').value;
        if (t === '20') containerSize = { w: 5.89, h: 2.39, d: 2.35, maxCbm: 28 };
        else if (t === '40') containerSize = { w: 12.03, h: 2.39, d: 2.35, maxCbm: 58 };
        else if (t === '40hc') containerSize = { w: 12.03, h: 2.69, d: 2.35, maxCbm: 68 };
        if (containerMesh) scene.remove(containerMesh);
        const geo = new THREE.BoxGeometry(containerSize.w, containerSize.h, containerSize.d);
        containerMesh = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2, transparent: true, opacity: 0.8 }));
        containerMesh.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x4a5568, transparent: true, opacity: 0.1, side: THREE.DoubleSide })));
        scene.add(containerMesh);
        document.getElementById('stat-total-cbm').innerText = containerSize.maxCbm.toFixed(2);
        updateStats(0); clear3DBoxes(); document.getElementById('download-tally-btn').classList.add('hidden');
    }

    function downloadTemplate() {
        const lnk = document.createElement("a");
        lnk.href = URL.createObjectURL(new Blob(["Item Name,Length (cm),Width (cm),Height (cm),Quantity,Color\nBox,50,40,30,20,#3b82f6"], { type: 'text/csv' }));
        lnk.download = "template.csv"; lnk.click();
    }

    function startPlanning() {
        const file = document.getElementById('csv-file').files[0];
        if (!file) return showMessage('Select a CSV file first.', 'text-red-500');
        Papa.parse(file, { skipEmptyLines: true, header: true, complete: function(res) {
            boxes = []; boxIdCounter = 0; const cMap = {}; 
            res.data.forEach((r) => {
                const gV = (kw) => { const k = Object.keys(r).find(x => kw.some(w => x.toLowerCase().includes(w))); return k ? r[k] : undefined; };
                const l = parseFloat(gV(['length','l (','len'])), w = parseFloat(gV(['width','w (','wid'])), h = parseFloat(gV(['height','h (','hgt'])), q = parseInt(gV(['quantity','qty']));
                if (isNaN(l) || isNaN(w) || isNaN(h) || isNaN(q)) return;
                let c = gV(['color']);
                if (c && c.trim() !== '') c = c.trim();
                else { const dk = `${l}x${w}x${h}`; if(!cMap[dk]) cMap[dk]=`hsl(${Math.floor(Math.random()*360)},75%,55%)`; c = cMap[dk]; }
                for (let i = 0; i < q; i++) boxes.push({ id: boxIdCounter++, orig_l: l, orig_w: w, orig_h: h, w: l/100, h: h/100, d: w/100, color: c });
            });
            if (boxes.length === 0) return showMessage('No valid data.', 'text-red-500');
            packContainer();
        }});
    }
       function downloadTallySheet() {
        if (globalPackedBoxes.length === 0) return alert("No packed data!");
        let rData = []; let cg = null; let stp = 1;
        for (let b of globalPackedBoxes) {
            let k = `${b.orig_l} x ${b.orig_w} x ${b.orig_h}`;
            if (cg && cg.size === k && cg.color === b.color) cg.qty += 1;
            else { if (cg) rData.push(cg); cg = { step: stp++, size: k, qty: 1, color: b.color }; }
        }
        if (cg) rData.push(cg);
        let csv = "Step,Box Size (L x W x H cm),Quantity,Color\n";
        rData.forEach(r => csv += `Step ${r.step},"${r.size}",${r.qty},${r.color}\n`);
        const lnk = document.createElement("a"); lnk.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); lnk.download = "Tally_Sheet.csv"; lnk.click();
    }

    function updateStats(used) {
        document.getElementById('stat-used-cbm').innerText = used.toFixed(2);
        const eff = Math.min(100, Math.max(0, (used / containerSize.maxCbm) * 100));
        document.getElementById('stat-efficiency-text').innerText = eff.toFixed(1) + '%';
        document.getElementById('stat-efficiency-bar').style.width = eff + '%';
    }

    function clear3DBoxes() { while(boxGroup.children.length > 0) boxGroup.remove(boxGroup.children[0]); globalPackedBoxes = []; }

    function intersects(fs, B) { return !(B.x >= fs.x+fs.w-0.001 || B.x+B.w <= fs.x+0.001 || B.y >= fs.y+fs.h-0.001 || B.y+B.h <= fs.y+0.001 || B.z >= fs.z+fs.d-0.001 || B.z+B.d <= fs.z+0.001); }
    
    function splitSpace(fs, B) {
        let s = [];
        if (B.y+B.h < fs.y+fs.h) s.push({ x:fs.x, y:B.y+B.h, z:fs.z, w:fs.w, h:fs.y+fs.h-(B.y+B.h), d:fs.d });
        if (B.y > fs.y) s.push({ x:fs.x, y:fs.y, z:fs.z, w:fs.w, h:B.y-fs.y, d:fs.d });
        if (B.x+B.w < fs.x+fs.w) s.push({ x:B.x+B.w, y:fs.y, z:fs.z, w:fs.x+fs.w-(B.x+B.w), h:fs.h, d:fs.d });
        if (B.x > fs.x) s.push({ x:fs.x, y:fs.y, z:fs.z, w:B.x-fs.x, h:fs.h, d:fs.d });
        if (B.z+B.d < fs.z+fs.d) s.push({ x:fs.x, y:fs.y, z:B.z+B.d, w:fs.w, h:fs.h, d:fs.z+fs.d-(B.z+B.d) });
        if (B.z > fs.z) s.push({ x:fs.x, y:fs.y, z:fs.z, w:fs.w, h:fs.h, d:B.z-fs.z });
        return s;
    }

    function pruneSpaces(sp) {
        let p = [];
        for (let i = 0; i < sp.length; i++) {
            let s1 = sp[i], enc = false;
            for (let j = 0; j < sp.length; j++) {
                if (i === j) continue; let s2 = sp[j];
                if (Math.abs(s1.x-s2.x)<0.001 && Math.abs(s1.y-s2.y)<0.001 && Math.abs(s1.z-s2.z)<0.001 && Math.abs(s1.w-s2.w)<0.001 && Math.abs(s1.h-s2.h)<0.001 && Math.abs(s1.d-s2.d)<0.001) { if(i>j) { enc=true; break; } }
                else if (s1.x>=s2.x-0.001 && s1.y>=s2.y-0.001 && s1.z>=s2.z-0.001 && s1.x+s1.w<=s2.x+s2.w+0.001 && s1.y+s1.h<=s2.y+s2.h+0.001 && s1.z+s1.d<=s2.z+s2.d+0.001) { enc=true; break; }
            }
            if (!enc) p.push(s1);
        }
        return p;
    }

    function packContainer() {
        clear3DBoxes();
        const sb = [...boxes].sort((a,b) => { const vA=a.w*a.h*a.d, vB=b.w*b.h*b.d; return Math.abs(vB-vA)>0.0001 ? vB-vA : Math.max(b.w,b.h,b.d)-Math.max(a.w,a.h,a.d); });
        let fs = [{ x:0, y:0, z:0, w:containerSize.w, h:containerSize.h, d:containerSize.d }];
        let pCount = 0, uCbm = 0, oCount = 0;
        for (let b of sb) {
            let bIdx = -1, bRot = null;
            fs.sort((a,b) => { if(Math.abs(a.y-b.y)>0.001) return a.y-b.y; if(Math.abs(a.z-b.z)>0.001) return a.z-b.z; return a.x-b.x; });
            const ur = [];
            for (let r of [{w:b.w,h:b.h,d:b.d}, {w:b.w,h:b.d,d:b.h}, {w:b.h,h:b.w,d:b.d}, {w:b.h,h:b.d,d:b.w}, {w:b.d,h:b.w,d:b.h}, {w:b.d,h:b.h,d:b.w}]) {
                if (!ur.some(u => Math.abs(u.w-r.w)<0.001 && Math.abs(u.h-r.h)<0.001 && Math.abs(u.d-r.d)<0.001)) ur.push(r);
            }
            for (let i = 0; i < fs.length; i++) {
                for (let r of ur) { if (r.w<=fs[i].w+0.001 && r.h<=fs[i].h+0.001 && r.d<=fs[i].d+0.001) { bIdx = i; bRot = r; break; } }
                if (bIdx !== -1) break;
            }
            if (bIdx !== -1) {
                let pb = { ...b, x:fs[bIdx].x, y:fs[bIdx].y, z:fs[bIdx].z, w:bRot.w, h:bRot.h, d:bRot.d };
                create3DBox(pb, pb.x, pb.y, pb.z); globalPackedBoxes.push(pb); pCount++; uCbm += (pb.w*pb.h*pb.d);
                let nfs = []; for (let f of fs) { if (intersects(f, pb)) nfs.push(...splitSpace(f, pb)); else nfs.push(f); }
                fs = pruneSpaces(nfs);
            } else oCount++;
        }
        updateStats(uCbm);
        if (pCount > 0) document.getElementById('download-tally-btn').classList.remove('hidden');
        if (oCount > 0) showMessage(`Packed ${pCount} items. ${oCount} overflowed!`, 'text-red-500 font-bold');
        else showMessage(`Success! ${pCount} items packed.`, 'text-green-500 font-bold');
    }

    function create3DBox(bd, x, y, z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(bd.w, bd.h, bd.d), new THREE.MeshLambertMaterial({ color: bd.color, polygonOffset: true, polygonOffsetFactor: 1 }));
        m.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(bd.w, bd.h, bd.d)), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })));
        m.position.set(-containerSize.w/2+x+bd.w/2, -containerSize.h/2+y+bd.h/2, -containerSize.d/2+z+bd.d/2);
        boxGroup.add(m);
    }

    function showMessage(t, c) { const m = document.getElementById('message-box'); m.className = `mb-3 text-sm text-center ${c}`; m.innerText = t; }
    function onWindowResize() { const c = document.getElementById('canvas-container'); camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(c.clientWidth, c.clientHeight); }
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    window.onload = init;
</script>
</body>
</html>
